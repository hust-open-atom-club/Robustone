name: Docker Image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build, test, and push to GHCR
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set image name
        id: image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$image:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and load image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=robustone-linux-amd64
          cache-to: type=gha,mode=max,scope=robustone-linux-amd64

      - name: Smoke-test image
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          docker run --rm "$IMAGE_TAG" --help
          docker run --rm "$IMAGE_TAG" --version
          docker run --rm "$IMAGE_TAG" riscv32 93001000

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push tested image
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          docker push "$IMAGE_TAG"
          {
            echo "## Docker image"
            echo "- Platform: linux/amd64"
            echo "- Revision: ${GITHUB_SHA}"
            echo "- Image: ${IMAGE_TAG}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]]; then
            docker tag "$IMAGE_TAG" "$IMAGE_NAME:latest"
            docker push "$IMAGE_NAME:latest"
            echo "- Image: ${IMAGE_NAME}:latest" >> "$GITHUB_STEP_SUMMARY"
          fi
